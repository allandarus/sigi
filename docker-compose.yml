services:
  db:
    image: postgres:15-alpine
    container_name: sigi_db
    env_file:
      - .env
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sigi_backend
    env_file:
      - .env
    volumes:
      - ./backend:/app
    depends_on:
      - db
    restart: unless-stopped
    command: >
      sh -c "if [ -f app/main.py ]; then uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload; else tail -f /dev/null; fi"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sigi_frontend
    env_file:
      - .env
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped
    command: >
      sh -c "if [ -f package.json ]; then npm run dev; else tail -f /dev/null; fi"

  redis:
    image: redis:7-alpine
    container_name: sigi_redis
    restart: unless-stopped

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sigi_celery_worker
    env_file:
      - .env
    volumes:
      - ./backend:/app
    depends_on:
      - db
      - redis
    restart: unless-stopped
    command: celery -A app.core.celery.celery_app worker --loglevel=info

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sigi_celery_beat
    env_file:
      - .env
    volumes:
      - ./backend:/app
    depends_on:
      - db
      - redis
    restart: unless-stopped
    command: celery -A app.core.celery.celery_app beat --loglevel=info

  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sigi_flower
    env_file:
      - .env
    volumes:
      - ./backend:/app
    depends_on:
      - redis
    restart: unless-stopped
    command: celery -A app.core.celery.celery_app flower --port=5555 --url_prefix=flower

  nginx:
    image: nginx:alpine
    container_name: sigi_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
      - flower
    restart: unless-stopped

volumes:
  postgres_data:
